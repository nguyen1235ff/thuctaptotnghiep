spring:
  application:
    name: food-delivery
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
  thymeleaf:
    check-template-location: false
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=FoodDelivery;encrypt=true;trustServerCertificate=true
    username: sa
    password: "123456" # Hãy chắc chắn mật khẩu sa này trùng với mật khẩu bạn vừa reset ở SSMS nhé
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # Mail Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.fooddelivery: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

app:
  security:
    jwt:
      secret: your-256-bit-secret-key-must-be-at-least-256-bits-long-for-HS256
      expiration: 3600000
      refresh-expiration: 604800000
  upload:
    dir: uploads
    base-url: /api/files
  frontend:
    url: http://localhost:3000